volumes:
  postgres_data: {}
  opensearch_data: {}
  s3_data: {}

networks:
  caddy_net:
    external: true

services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: philomena_prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:3.2.0
    volumes:
      - opensearch_data:/usr/share/opensearch/data
      - ./docker/opensearch/opensearch.yml:/usr/share/opensearch/config/opensearch.yml
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9200/']
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8.1.3-alpine
    restart: unless-stopped

  # Local S3-compatible file storage backed by the host filesystem.
  # Stores all uploaded images, avatars, and other media in the s3_data volume.
  # No bucket pre-creation needed — s3proxy treats any path as a valid bucket.
  files:
    image: andrewgaul/s3proxy:sha-9f66ef5
    environment:
      JCLOUDS_FILESYSTEM_BASEDIR: /data
      S3PROXY_IGNORE_UNKNOWN_HEADERS: 'true'
    volumes:
      - s3_data:/data
    restart: unless-stopped

  # Init container: waits for postgres + opensearch, initialises the schema on
  # first boot, seeds default data, then runs any pending migrations. Exits 0
  # on success. app and worker will not start until this completes.
  setup:
    image: ghcr.io/philomena-dev/philomena:master
    command: /usr/local/bin/setup-production
    env_file: .env
    environment:
      # setup-production calls psql directly and does not parse DATABASE_URL,
      # so libpq connection variables must be set explicitly.
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: philomena_prod
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    restart: 'no'

  app:
    image: ghcr.io/philomena-dev/philomena:master
    command: /usr/local/bin/run-production
    env_file: .env
    depends_on:
      setup:
        condition: service_completed_successfully
      valkey:
        condition: service_started
      files:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 4000']
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  worker:
    image: ghcr.io/philomena-dev/philomena:master
    command: /usr/local/bin/run-production
    env_file: .env
    environment:
      START_WORKER: 'true'
    depends_on:
      setup:
        condition: service_completed_successfully
      valkey:
        condition: service_started
    restart: unless-stopped

  # Runs run-cron every hour and run-cron-daily once every 24 hours.
  cron:
    image: ghcr.io/philomena-dev/philomena:master
    command: >-
      sh -c 'hours=0; while true; do
        /usr/local/bin/run-cron;
        hours=$$((hours+1));
        [ $$((hours%24)) -eq 0 ] && /usr/local/bin/run-cron-daily;
        sleep 3600;
      done'
    env_file: .env
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

  # Internal Caddy: serves compiled static assets from /var/www, proxies image
  # and media requests to the s3proxy (files service), and reverse-proxies
  # everything else to the app. No ports exposed to the host — your external
  # Caddy reaches this container via caddy_net.
  web:
    image: ghcr.io/philomena-dev/philomena-web:master
    env_file: .env
    environment:
      APP_ADDRESS: app:4000
      DOWNTIME: 'false'
    volumes:
      - ./docker/production/web/Caddyfile:/etc/caddy/Caddyfile
    networks:
      - default
      - caddy_net
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
